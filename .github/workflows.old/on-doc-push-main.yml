# on-doc-push-main.yml
#
# Triggered when doc files are pushed to main.
# Deploys the freshly generated doc to GitHub Pages (target directory only).
#
# Deploy strategy:
#   - Doc is always fully regenerated before each deploy (by agent or by PO)
#   - Target directory on gh-pages is wiped before deploying (no residue)
#   - Other projects on gh-pages are preserved (keep_files: true)
#
# URL structure on GitHub Pages:
#   - oneticket framework : /docs/
#   - user project        : /apps/<project>/docs/
#
# Candidate actions for deployment (to evaluate):
#   - peaceiris/actions-gh-pages@v4  — destination_dir + keep_files: true
#                                      requires manual bash clean step before deploy
#   - JamesIves/github-pages-deploy-action — target-folder, more control on clean
#
# Deployment steps (placeholder — to implement):
#   1. Detect project from modified path
#   2. Checkout gh-pages branch
#   3. rm -rf <destination_dir>   ← clean targeted dir only
#   4. Deploy fresh content       ← peaceiris or JamesIves action
#   5. keep_files: true           ← preserve other projects

name: Doc Push (Main)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/docs/**'
      - '.oneticket/docs/**'

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Detect project
        run: |
          MODIFIED="${{ github.event.head_commit.modified[0] }}"
          if [[ "$MODIFIED" == .oneticket/docs/* ]]; then
            echo "doc push detected — project: oneticket (framework)"
          else
            PROJECT=$(echo "$MODIFIED" | cut -d'/' -f2)
            echo "doc push detected — project: $PROJECT"
          fi

      # TODO: clean targeted dir on gh-pages + deploy fresh content
      # Step: checkout gh-pages, rm -rf <destination_dir>, deploy via action
