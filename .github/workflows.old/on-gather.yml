name: Workflow Gather

# [DETERMINISTIC] Collects task completion signals and orchestrates next steps.
# Triggered by dispatch-gather.mjs via workflow_dispatch after a task branch is pushed.
#
# This approach is reliable regardless of GitHub PR mergeability checks —
# workflow_dispatch is not blocked by merge conflicts.
#
# The task PR (task/* → feature/issue-N) is still created for visibility,
# but the real GATHER signal is this workflow_dispatch.
# orchestrate.mjs merges the task branch directly (git merge --no-ff),
# resolves workflow.md conflicts via .gitattributes merge=union,
# and closes the PR after merge.
#
# Security: validate-task-branch.mjs ensures task/issue-N-X only merges
# into feature/issue-N — never into another issue or main.
#
# Pattern: Scatter/Gather — this workflow is the Gather + FAN-IN + optional re-Scatter
#
# [CONCURRENCY] No GitHub concurrency here — manifest access conflicts
# are handled in orchestrate.mjs with push retry (optimistic git lock).

on:
  workflow_dispatch:
    inputs:
      task_branch:
        required: true
        type: string
        description: "Task branch to merge (e.g. task/issue-42-A)"
      branch_base:
        required: true
        type: string
        description: "Feature branch to merge into (e.g. feature/issue-42)"

jobs:
  # [VALIDATE + PARSE] Validates branch coherence and extracts issue number
  extract:
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.validate.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      - name: Validate branch coherence
        id: validate
        run: |
          node src/validate-task-branch.mjs "${{ inputs.task_branch }}" "${{ inputs.branch_base }}"
          ISSUE=$(echo "${{ inputs.task_branch }}" | sed 's/task\/issue-\([0-9]*\)-.*/\1/')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

  orchestrate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # [DETERMINISTIC ROUTING] orchestrate.mjs decides next steps — never the LLM
      # Merges task branch, resolves workflow.md via merge=union, closes task PR,
      # routes to next FAN-OUT or creates final PR when all tasks are done
      - name: Run orchestrator — merge, update manifest, route or create PR
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          TASK_BRANCH: ${{ inputs.task_branch }}
          REPO: ${{ github.repository }}
        run: node src/orchestrate.mjs

  # [FAILURE NOTIFICATION] Posted on the issue if the orchestrate job fails.
  notify-failure:
    needs: [extract, orchestrate]
    if: failure() && needs.extract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ needs.extract.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Orchestration failure — branch \`${{ inputs.task_branch }}\`

          The orchestration workflow failed while processing the GATHER signal.

          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Check the run logs to identify the cause (merge conflict, corrupted manifest, network error)."
