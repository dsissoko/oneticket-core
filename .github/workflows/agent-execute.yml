name: Agent Execute

# [AGENTIQUE] Seul workflow impliquant un LLM (anomalyco/opencode).
#
# Invoqué dans deux contextes :
#   - Invocation libre  : déclenché par Comment Dispatcher via agent-dispatch.mjs
#                         prompt = "tu es /role, <demande> + contexte issue"
#   - Exécution tâche   : déclenché par agent-launcher.mjs (FAN-OUT)
#                         prompt = instructions bornées pour produire un fichier
#
# Dans les deux cas le mécanisme est identique :
#   1. Génération config opencode depuis agents/config.yml → OPENCODE_CONFIG_CONTENT
#   2. Checkout déterministe de la branche
#   3. anomalyco reçoit le prompt complet — output libre
#   4. Push déterministe
#
# Config agent CI : générée à la volée par src/generate-config.mjs
# → injectée via OPENCODE_CONFIG_CONTENT (mécanisme officiel opencode)
# → aucun fichier de config écrit sur le disque
#
# Retry sur échec anomalyco (rate-limit GitHub API) :
#   - continue-on-error: true sur le step agentique
#   - re-dispatch avec retry_count+1 et délai croissant (10s × n)
#   - max défini par retry_max dans agents/config.yml (défaut: 3)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: false
        type: string
        default: ""
      prompt:
        required: true
        type: string
      retry_count:
        required: false
        type: string
        default: "0"
      retry_max:
        required: false
        type: string
        default: "3"
      model:
        required: false
        type: string
        default: "opencode/claude-haiku-4-5"
      role:
        required: false
        type: string
        default: ""

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [DÉTERMINISTE] Checkout de la branche de travail
      # - Cas FAN-OUT (branch_base fourni) : checkout branch_base (toujours existante)
      #   la branche task/* sera créée depuis cette base dans le step suivant
      # - Cas invocation libre (branch_base vide) : checkout branch directement
      #   (feature/issue-N déjà créée par agent-dispatch.mjs)
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base != '' && inputs.branch_base || inputs.branch }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "oneticket-bot"
          git config user.email "oneticket-bot@users.noreply.github.com"

      # [DÉTERMINISTE] Crée la branche task/* depuis branch_base (cas FAN-OUT uniquement)
      # Si branch_base est vide (invocation libre), on est déjà sur la bonne branche
      - name: Ensure task branch exists
        run: |
          if [ -z "${{ inputs.branch_base }}" ]; then
            echo "Pas de branch_base — branche ${{ inputs.branch }} déjà checkoutée."
            exit 0
          fi
          if git ls-remote --heads origin ${{ inputs.branch }} | grep -q ${{ inputs.branch }}; then
            echo "Branche ${{ inputs.branch }} existe déjà, checkout."
            git fetch origin ${{ inputs.branch }}
            git checkout -B ${{ inputs.branch }} origin/${{ inputs.branch }}
          else
            echo "Création de la branche ${{ inputs.branch }} depuis ${{ inputs.branch_base }}."
            git checkout -b ${{ inputs.branch }}
            git push origin ${{ inputs.branch }}
          fi

      # [DÉTERMINISTE] Génère la config opencode depuis agents/config.yml
      # → injectée dans OPENCODE_CONFIG_CONTENT (override runtime officiel opencode)
      # Si role fourni → default_agent injecté pour que opencode charge le bon profil
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate opencode config
        id: agent-config
        run: |
          npm ci --silent
          CONFIG=$(node src/generate-config.mjs "${{ inputs.role }}")
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      # [AGENTIQUE] Invocation anomalyco avec le prompt complet
      # Le prompt est construit en amont par le code déterministe (.mjs)
      # L'agent ne push pas, ne crée pas de PR — step déterministe s'en charge
      # OPENCODE_CONFIG_CONTENT : config injectée depuis agents/config.yml
      - name: Run agent
        id: run-agent
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          OPENCODE_CONFIG_CONTENT: ${{ steps.agent-config.outputs.config }}
          PROMPT: ${{ inputs.prompt }}
        with:
          model: ${{ inputs.model }}
          share: false
          use_github_token: true
          prompt: ${{ inputs.prompt }}

      # [RETRY] Echec anomalyco → re-dispatch via retry-dispatch.mjs
      # Utilise dispatchWorkflow() (API GitHub JSON) — même mécanisme que le premier dispatch
      # → safe pour tout contenu (code, caractères spéciaux, guillemets, sauts de ligne)
      # Contrairement au bash 'gh workflow run --field prompt="..."' qui interprète le shell
      - name: Retry on agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO: ${{ github.repository }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RETRY_MAX: ${{ inputs.retry_max }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
          BRANCH_BASE: ${{ inputs.branch_base }}
          ROLE: ${{ inputs.role }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: node src/retry-dispatch.mjs

      # [DÉTERMINISTE] Push final
      # Skippé si l'agent a échoué (le retry prend le relais)
      - name: Push branch
        if: steps.run-agent.outcome == 'success'
        run: |
          git push origin ${{ inputs.branch }}

      # [DÉTERMINISTE] FAN-OUT si l'agent a produit un manifest
      # Uniquement pour les invocations libres (branch_base vide = /po, /dev, etc.)
      # Les tâches FAN-OUT (branch_base non vide) n'ont pas à re-déclencher le FAN-OUT
      # car orchestrate.mjs s'en charge via Workflow Gather — évite le double launchReadyTasks (R2)
      - name: Launch FAN-OUT if manifest present
        if: steps.run-agent.outcome == 'success' && inputs.branch_base == ''
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f "tasks/issue-${{ inputs.issue_number }}/manifest.json" ]; then
            echo "Manifest détecté — lancement FAN-OUT"
            node src/launch-fanout.mjs
          else
            echo "Pas de manifest — rien à faire"
          fi

  # [FAILURE NOTIFICATION] Posté sur l'issue si échec définitif
  notify-failure:
    needs: execute
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Agent Execute failure

          Le workflow d'exécution a échoué (retry_count=${{ inputs.retry_count }}/${{ inputs.retry_max }}).

          **Branche :** \`${{ inputs.branch }}\`
          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
