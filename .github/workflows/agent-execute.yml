name: Agent Execute

# [AGENTIQUE] Seul workflow impliquant un LLM (anomalyco/opencode).
#
# Invoqué dans deux contextes :
#   - Invocation libre  : déclenché par Comment Dispatcher via agent-dispatch.mjs
#                         prompt = "tu es @role, <demande> + contexte issue"
#   - Exécution tâche   : déclenché par agent-launcher.mjs (FAN-OUT)
#                         prompt = instructions bornées pour produire un fichier
#
# Dans les deux cas le mécanisme est identique :
#   1. Génération config opencode depuis .oneticket/config.yml → OPENCODE_CONFIG_CONTENT
#      → le modèle est extrait de agent_config.<cli>.model et passé en input model
#   2. Checkout déterministe de la branche
#   3. anomalyco reçoit le prompt complet — output libre
#   4. Push déterministe
#
# Config agent CI : générée à la volée par src/generate-config.mjs
# → injectée via OPENCODE_CONFIG_CONTENT (mécanisme officiel opencode)
# → aucun fichier de config écrit sur le disque
#
# Retry sur échec anomalyco (rate-limit GitHub API) :
#   - continue-on-error: true sur le step agentique
#   - re-dispatch avec retry_count+1 et délai croissant
#   - max défini par retry_max dans .oneticket/config.yml

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: false
        type: string
        default: ""
      prompt:
        required: true
        type: string
      retry_count:
        required: false
        type: string
        default: "0"
      retry_max:
        required: true
        type: string
      model:
        required: true
        type: string
      role:
        required: false
        type: string
        default: ""

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [DÉTERMINISTE] Checkout de la branche de travail
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base != '' && inputs.branch_base || inputs.branch }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      # [DÉTERMINISTE] Crée la branche task/* depuis branch_base (cas FAN-OUT uniquement)
      - name: Ensure task branch exists
        run: |
          if [ -z "${{ inputs.branch_base }}" ]; then
            echo "Pas de branch_base — branche ${{ inputs.branch }} déjà checkoutée."
            exit 0
          fi
          if git ls-remote --heads origin ${{ inputs.branch }} | grep -q ${{ inputs.branch }}; then
            echo "Branche ${{ inputs.branch }} existe déjà, checkout."
            git fetch origin ${{ inputs.branch }}
            git checkout -B ${{ inputs.branch }} origin/${{ inputs.branch }}
          else
            echo "Création de la branche ${{ inputs.branch }} depuis ${{ inputs.branch_base }}."
            git checkout -b ${{ inputs.branch }}
            git push origin ${{ inputs.branch }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      # [DÉTERMINISTE] Configure git depuis .oneticket/config.yml
      # Source de vérité unique — aucune valeur hardcodée dans ce workflow
      - name: Configure git
        run: |
          git config user.name "$(node src/print-config.mjs oneticket_git_user_name)"
          git config user.email "$(node src/print-config.mjs oneticket_git_user_email)"

      # [DÉTERMINISTE] Génère la config opencode depuis .oneticket/config.yml
      # → injectée dans OPENCODE_CONFIG_CONTENT (override runtime officiel opencode)
      - name: Generate opencode config
        id: agent-config
        run: |
          CONFIG=$(node src/generate-config.mjs "${{ inputs.role }}")
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      # [AGENTIQUE] Invocation anomalyco avec le prompt complet
      # with: model: est obligatoire pour l'action anomalyco (required: true dans action.yml)
      # La valeur vient de agent_config.<cli>.model dans .oneticket/config.yml
      # OPENCODE_CONFIG_CONTENT surcharge ensuite la config runtime avec les mêmes valeurs
      - name: Run agent
        id: run-agent
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          OPENCODE_CONFIG_CONTENT: ${{ steps.agent-config.outputs.config }}
          PROMPT: ${{ inputs.prompt }}
        with:
          model: ${{ inputs.model }}
          share: false
          use_github_token: true
          prompt: ${{ inputs.prompt }}

      # [RETRY] Echec anomalyco → re-dispatch via retry-dispatch.mjs
      - name: Retry on agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO: ${{ github.repository }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RETRY_MAX: ${{ inputs.retry_max }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
          BRANCH_BASE: ${{ inputs.branch_base }}
          ROLE: ${{ inputs.role }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: node src/retry-dispatch.mjs

      # [DÉTERMINISTE] Push final
      - name: Push branch
        if: steps.run-agent.outcome == 'success'
        run: |
          git push origin ${{ inputs.branch }}

      # [DÉTERMINISTE] FAN-OUT si l'agent a produit un manifest
      - name: Launch FAN-OUT if manifest present
        if: steps.run-agent.outcome == 'success' && inputs.branch_base == ''
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f ".oneticket/tasks/issue-${{ inputs.issue_number }}/manifest.json" ]; then
            echo "Manifest détecté — lancement FAN-OUT"
            node src/launch-fanout.mjs
          else
            echo "Pas de manifest — rien à faire"
          fi

  # [FAILURE NOTIFICATION] Posté sur l'issue si échec définitif
  notify-failure:
    needs: execute
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Agent Execute failure

          Le workflow d'exécution a échoué (retry_count=${{ inputs.retry_count }}/${{ inputs.retry_max }}).

          **Branche :** \`${{ inputs.branch }}\`
          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
