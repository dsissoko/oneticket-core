name: Agent Execute

# [AGENTIC] Only workflow involving an LLM (anomalyco/opencode).
#
# Triggered by agent-dispatch.mjs via workflow_dispatch.
#
# Steps:
#   1. Checkout working branch
#   2. Install APM + skills
#   3. Exclude sandbox artefacts
#   4. Configure git
#   5. Run anomalyco/opencode with injected prompt
#   6. Push branch on success

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      branch:
        required: true
        type: string
      prompt:
        required: true
        type: string
      retry_count:
        required: false
        type: string
        default: "0"
      retry_max:
        required: true
        type: string
      model:
        required: true
        type: string
      role:
        required: false
        type: string
        default: ""
      is_fanout_task:
        required: false
        type: string
        default: "false"

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [GUARD] Validate branch name
      # - feature/issue-N        for standard agentic tasks
      # - task/issue-N-X         for FAN-OUT tasks (is_fanout_task == "true")
      - name: Validate branch name
        run: |
          BRANCH="${{ inputs.branch }}"
          IS_FANOUT="${{ inputs.is_fanout_task }}"
          if echo "$BRANCH" | grep -qE '^feature/issue-[0-9]+$'; then
            echo "[guard] feature branch — OK: $BRANCH"
          elif [ "$IS_FANOUT" = "true" ] && echo "$BRANCH" | grep -qE '^task/issue-[0-9]+-[A-Za-z0-9]+$'; then
            echo "[guard] fanout task branch — OK: $BRANCH"
          else
            echo "[guard] REJECTED: '$BRANCH' — expected feature/issue-N or (is_fanout_task=true) task/issue-N-X"
            exit 1
          fi

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      # [DETERMINISTIC] Install APM CLI — retry up to 3 times on transient network errors
      - name: Install APM
        run: |
          for i in 1 2 3; do
            curl -sSL https://aka.ms/apm-unix | sh && break
            echo "[apm-install] attempt $i failed, retrying in 5s..."
            sleep 5
          done

      # [DETERMINISTIC] Copy .oneticket/apm.yml → apm.yml (repo root, read by apm install)
      # and .oneticket/.apm/ → .apm/ (instructions compiled by apm compile)
      # Must run before apm install.
      - name: Copy APM config to repo root
        run: node src/oneticket-install.mjs --apm-only

      # [DETERMINISTIC] Install skills and agent profiles via APM
      # Reads apm.yml from repo root (copied above)
      # Deploys to .agents/skills/ and .opencode/agents/
      - name: Install skills via APM
        run: apm install --target opencode
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}

      # [DETERMINISTIC] Compile instructions → .agents/AGENTS.md
      # apm install may skip compilation when lockfile says nothing changed.
      # apm compile --target opencode --clean guarantees a fresh AGENTS.md
      # from .apm/instructions/*.instructions.md on every run.
      - name: Compile APM instructions
        run: apm compile --target opencode --clean

      # [DETERMINISTIC] Install local skills — overrides any same-named APM skill
      # Must run after apm install so local skills take precedence.
      - name: Install local skills
        run: node src/oneticket-install.mjs --skills-only

      # [DETERMINISTIC] Exclude sandbox artefacts and dynamic config files from git index
      - name: Exclude sandbox artefacts from git
        run: |
          echo ".agents/" >> .git/info/exclude
          echo ".opencode/" >> .git/info/exclude
          echo "opencode.json" >> .git/info/exclude
          echo "apm.yml" >> .git/info/exclude
          echo "apm.lock.yaml" >> .git/info/exclude
          echo ".apm/" >> .git/info/exclude
          echo "AGENTS.md" >> .git/info/exclude

      # [DETERMINISTIC] Configure git from .oneticket/config.yml
      - name: Configure git
        run: |
          git config user.name "$(node src/print-config.mjs oneticket_git_user_name)"
          git config user.email "$(node src/print-config.mjs oneticket_git_user_email)"

      # [DETERMINISTIC] Clear opencode session cache
      - name: Clear opencode session cache
        run: |
          CLEAR=$(node src/print-config.mjs clear_session_cache)
          if [ "$CLEAR" != "false" ]; then
            rm -rf ~/.local/share/opencode/sessions 2>/dev/null || true
            echo "[session-cache] cleared"
          fi

      # [DETERMINISTIC] Generate opencode config — injects default_agent: <role>
      # so opencode loads the agent profile from .opencode/agents/<role>.md (installed by APM)
      - name: Generate opencode config
        id: agent-config
        run: |
          CONFIG=$(node src/generate-config.mjs "${{ inputs.role }}")
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      # [AGENTIC] Invoke anomalyco/opencode with the injected prompt
      - name: Run agent
        id: run-agent
        continue-on-error: true
        uses: anomalyco/opencode/github@v1.15.10
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          OPENCODE_CONFIG_CONTENT: ${{ steps.agent-config.outputs.config }}
          PROMPT: ${{ inputs.prompt }}
        with:
          model: ${{ inputs.model }}
          share: false
          use_github_token: true
          prompt: ${{ inputs.prompt }}

      # [RETRY] anomalyco failure → re-dispatch via retry-dispatch.mjs
      # Exponential backoff + jitter — applies blocked label at retry_max exhaustion
      # Note: continue-on-error on run-agent means failure() is never true at job level
      # — use steps.run-agent.outcome == 'failure' instead
      - name: Retry on agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GITHUB_TOKEN:   ${{ secrets.ONETICKET_GH_PAT }}
          REPO:           ${{ github.repository }}
          RETRY_COUNT:    ${{ inputs.retry_count }}
          RETRY_MAX:      ${{ inputs.retry_max }}
          ISSUE_NUMBER:   ${{ inputs.issue_number }}
          BRANCH:         ${{ inputs.branch }}
          ROLE:           ${{ inputs.role }}
          MODEL:          ${{ inputs.model }}
          PROMPT:         ${{ inputs.prompt }}
          IS_FANOUT_TASK: ${{ inputs.is_fanout_task }}
        run: node src/retry-dispatch.mjs

      # [DETERMINISTIC] Notify agent failure on issue — covers all error types
      # (CreditsError, rate limit, timeout, etc.) not caught by notify-failure job
      # Also applies dev error label on issue + PR to signal the failure visually
      - name: Notify agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH:       ${{ inputs.branch }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RETRY_COUNT:  ${{ inputs.retry_count }}
          RETRY_MAX:    ${{ inputs.retry_max }}
          IS_FANOUT_TASK: ${{ inputs.is_fanout_task }}
        run: node src/notify-agent-failure.mjs

      # [GUARD] Close rogue PRs and delete rogue branches created by the agent
      # Protects against opencode/dispatch-* branches created when switched=true is not honored
      - name: Cleanup rogue branches
        if: steps.run-agent.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
        run: |
          # Find and close any open PR on opencode/dispatch-* branches
          ROGUE_PRS=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("opencode/dispatch-")) | .number')
          if [ -n "$ROGUE_PRS" ]; then
            for PR_NUM in $ROGUE_PRS; do
              echo "[cleanup] Closing rogue PR #$PR_NUM"
              gh pr close "$PR_NUM" --repo "$REPO" \
                --comment "Closed automatically — rogue branch created by agent instead of committing to \`${{ inputs.branch }}\`. See fix/issue-1123."
            done
          fi
          # Delete rogue remote branches
          ROGUE_BRANCHES=$(git ls-remote --heads origin 'refs/heads/opencode/dispatch-*' | awk '{print $2}' | sed 's|refs/heads/||')
          if [ -n "$ROGUE_BRANCHES" ]; then
            for B in $ROGUE_BRANCHES; do
              echo "[cleanup] Deleting rogue branch $B"
              git push origin --delete "$B" || true
            done
          fi

      # [DETERMINISTIC] Push branch on success
      - name: Push branch
        if: steps.run-agent.outcome == 'success'
        run: git push origin ${{ inputs.branch }}

      # [DETERMINISTIC] Create PR feature/issue-N → main if files were pushed
      # Idempotent — skips if PR exists, skips if no commits ahead, skips for task/* branches
      - name: Create PR
        if: steps.run-agent.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH:       ${{ inputs.branch }}
        run: node src/create-pr.mjs

      # [DETERMINISTIC] Trigger Gather workflow after task branch push (FAN-OUT tasks only)
      - name: Dispatch Gather
        if: steps.run-agent.outcome == 'success' && inputs.is_fanout_task == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
          TASK_BRANCH:  ${{ inputs.branch }}
        run: node src/dispatch-gather.mjs

      # [DETERMINISTIC] Trigger FAN-OUT if manifest present (direct agent runs only)
      - name: Dispatch FAN-OUT
        if: steps.run-agent.outcome == 'success' && inputs.is_fanout_task == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node src/dispatch-fanout.mjs

  notify-failure:
    needs: execute
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --silent
      - name: Post failure comment on issue
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH:       ${{ inputs.branch }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RETRY_COUNT:  ${{ inputs.retry_count }}
          RETRY_MAX:    ${{ inputs.retry_max }}
          IS_FANOUT_TASK: ${{ inputs.is_fanout_task }}
        run: node src/notify-agent-failure.mjs
