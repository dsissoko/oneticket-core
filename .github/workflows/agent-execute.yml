name: Agent Execute

# [AGENTIC] Only workflow involving an LLM (anomalyco/opencode).
#
# Invoked in two contexts:
#   - Free invocation : triggered by Comment Dispatcher via agent-dispatch.mjs
#                       prompt = "you are @role, <request> + issue context"
#   - Task execution  : triggered by agent-launcher.mjs (FAN-OUT)
#                       prompt = bounded instructions to produce a file
#
# In both cases the mechanism is identical:
#   1. Generate opencode config from .oneticket/config.yml → OPENCODE_CONFIG_CONTENT
#      → model is extracted from agent_config.<cli>.model and passed as input model
#   2. Deterministic branch checkout
#   3. anomalyco receives the full prompt — free output
#   4. Deterministic push
#
# CI agent config: generated on-the-fly by src/generate-config.mjs
# → injected via OPENCODE_CONFIG_CONTENT (official opencode runtime override mechanism)
# → no config file written to disk
#
# Retry on anomalyco failure (GitHub API rate-limit):
#   - continue-on-error: true on the agentic step
#   - re-dispatch with retry_count+1 and increasing delay
#   - max defined by retry_max in .oneticket/config.yml

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: false
        type: string
        default: ""
      prompt:
        required: true
        type: string
      retry_count:
        required: false
        type: string
        default: "0"
      retry_max:
        required: true
        type: string
      model:
        required: true
        type: string
      role:
        required: false
        type: string
        default: ""

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [DETERMINISTIC] Checkout the working branch
      # - FAN-OUT case (branch_base provided): checkout branch_base (always exists)
      #   the task/* branch will be created from it in the next step
      # - Free invocation (branch_base empty): checkout branch directly
      #   (feature/issue-N already created by agent-dispatch.mjs)
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base != '' && inputs.branch_base || inputs.branch }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      # [DETERMINISTIC] Create task/* branch from branch_base (FAN-OUT case only)
      # If branch_base is empty (free invocation), we are already on the right branch
      - name: Ensure task branch exists
        run: |
          if [ -z "${{ inputs.branch_base }}" ]; then
            echo "No branch_base — branch ${{ inputs.branch }} already checked out."
            exit 0
          fi
          if git ls-remote --heads origin ${{ inputs.branch }} | grep -q ${{ inputs.branch }}; then
            echo "Branch ${{ inputs.branch }} already exists, checking out."
            git fetch origin ${{ inputs.branch }}
            git checkout -B ${{ inputs.branch }} origin/${{ inputs.branch }}
          else
            echo "Creating branch ${{ inputs.branch }} from ${{ inputs.branch_base }}."
            git checkout -b ${{ inputs.branch }}
            git push origin ${{ inputs.branch }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      # [DETERMINISTIC] Clear opencode session cache — conditioned on clear_session_cache in config.yml
      # Runs after npm ci — uses print-config.mjs to read config (single source of truth)
      # true (default) — fresh session, prevents stale skills/context resumption
      # false — session persistence enabled for performance (set when oneticket is stable)
      - name: Clear opencode session cache
        run: |
          CLEAR=$(node src/print-config.mjs clear_session_cache)
          if [ "$CLEAR" != "false" ]; then
            rm -rf ~/.local/share/opencode/sessions 2>/dev/null || true
            echo "[session-cache] cleared"
          else
            echo "[session-cache] kept (clear_session_cache=false)"
          fi

      # [DETERMINISTIC] Install OneTicket skills into .agents/skills/
      # so they are natively discovered by opencode before the agent runs.
      # TODO: apm install will replace or complement this step in a future version.
      - name: Install OneTicket skills
        run: node src/oneticket-install.mjs

      # [DETERMINISTIC] Exclude sandbox artefacts from git index for this CI clone
      # Prevents .agents/, .opencode/, opencode.json from being committed by the agent.
      # Uses .git/info/exclude — local to this clone, never committed, invisible to the agent.
      # Dev framework remains free to version any of these locally.
      - name: Exclude sandbox artefacts from git
        run: |
          echo ".agents/" >> .git/info/exclude
          echo ".opencode/" >> .git/info/exclude
          echo "opencode.json" >> .git/info/exclude

      # [DETERMINISTIC] Configure git from .oneticket/config.yml
      # Single source of truth — no hardcoded values in this workflow
      - name: Configure git
        run: |
          git config user.name "$(node src/print-config.mjs oneticket_git_user_name)"
          git config user.email "$(node src/print-config.mjs oneticket_git_user_email)"

      # [DETERMINISTIC] Generate opencode config from .oneticket/config.yml
      # → injected into OPENCODE_CONFIG_CONTENT (official opencode runtime override)
      - name: Generate opencode config
        id: agent-config
        run: |
          CONFIG=$(node src/generate-config.mjs "${{ inputs.role }}")
          echo "config=$CONFIG" >> $GITHUB_OUTPUT

      # [AGENTIC] Invoke anomalyco with the full prompt
      # The prompt is built upstream by deterministic code (.mjs)
      # The agent does not push, does not create PRs — deterministic steps handle that
      # with: model: is required by the anomalyco action (required: true in action.yml)
      # OPENCODE_CONFIG_CONTENT overrides the runtime config with the same values
      - name: Run agent
        id: run-agent
        continue-on-error: true
        uses: anomalyco/opencode/github@v1.15.10
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          OPENCODE_CONFIG_CONTENT: ${{ steps.agent-config.outputs.config }}
          PROMPT: ${{ inputs.prompt }}
        with:
          model: ${{ inputs.model }}
          share: false
          use_github_token: true
          prompt: ${{ inputs.prompt }}

      # [RETRY] anomalyco failure → re-dispatch via retry-dispatch.mjs
      # Uses dispatchWorkflow() (GitHub JSON API) — same mechanism as first dispatch
      # → safe for any content (code, special chars, quotes, newlines)
      - name: Retry on agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO: ${{ github.repository }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RETRY_MAX: ${{ inputs.retry_max }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BRANCH: ${{ inputs.branch }}
          BRANCH_BASE: ${{ inputs.branch_base }}
          ROLE: ${{ inputs.role }}
          MODEL: ${{ inputs.model }}
          PROMPT: ${{ inputs.prompt }}
        run: node src/retry-dispatch.mjs

      # [DETERMINISTIC] Final push
      # Skipped if the agent failed (retry takes over)
      - name: Push branch
        if: steps.run-agent.outcome == 'success'
        run: |
          git push origin ${{ inputs.branch }}

      # [DETERMINISTIC] Open PR task/* → feature/issue-N as completion signal
      # Only for FAN-OUT tasks (branch_base non-empty) — not for free invocations
      # This PR is the GATHER trigger — not a human PR
      # continue-on-error: true — if the agent produced no commits, no diff exists and pr create fails gracefully
      - name: Open task PR as completion signal
        if: steps.run-agent.outcome == 'success' && inputs.branch_base != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --head ${{ inputs.branch }} \
            --base ${{ inputs.branch_base }} \
            --title "chore: task ${{ inputs.branch }} complete" \
            --body "Automated task completion signal — do not merge manually." 

      # [DETERMINISTIC] Trigger Gather via workflow_dispatch — reliable signal
      # Independent of GitHub PR mergeability check (which can block pull_request triggers)
      # The PR above is cosmetic (visibility) — this dispatch is the real signal
      - name: Trigger Gather
        if: steps.run-agent.outcome == 'success' && inputs.branch_base != ''
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          REPO: ${{ github.repository }}
          TASK_BRANCH: ${{ inputs.branch }}
          BRANCH_BASE: ${{ inputs.branch_base }}
        run: node src/dispatch-gather.mjs

      # [DETERMINISTIC] FAN-OUT if the agent produced a manifest — otherwise create PR directly
      # Only for free invocations (branch_base empty = @po, @dev, etc.)
      # FAN-OUT tasks (branch_base non-empty) must not re-trigger FAN-OUT
      # as orchestrate.mjs handles it via Workflow Gather — avoids double launchReadyTasks
      - name: Launch FAN-OUT or create PR if no manifest
        if: steps.run-agent.outcome == 'success' && inputs.branch_base == ''
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f ".oneticket/tasks/issue-${{ inputs.issue_number }}/manifest.json" ]; then
            echo "Manifest detected — launching FAN-OUT"
            node src/launch-fanout.mjs
          else
            echo "No manifest — creating PR directly"
            node src/create-direct-pr.mjs
          fi

  # [FAILURE NOTIFICATION] Posted on the issue on definitive failure
  notify-failure:
    needs: execute
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Agent Execute failure

          The execution workflow failed (retry_count=${{ inputs.retry_count }}/${{ inputs.retry_max }}).

          **Branch:** \`${{ inputs.branch }}\`
          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
