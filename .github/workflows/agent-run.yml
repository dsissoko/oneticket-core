name: Agent Run

# [EXÉCUTION TÂCHE] Déclenché par agent-launcher.mjs via workflow_dispatch.
#
# Architecture :
#   DÉTERMINISTE : checkout, création branche task/*, params.json, push final (signal GATHER)
#   LLM (anomalyco) : lire params.json, créer le fichier texte, commiter UNIQUEMENT
#
# Mécanisme anti-PR :
#   - workflow_dispatch est supporté nativement par l'action (REPO_EVENTS)
#   - L'action crée opencode/dispatch-* localement (fantôme, jamais pushée)
#   - Le prompt force git checkout task/* en première action
#   - branchIsDirty() détecte switched=true → PAS de push ni PR par l'action
#   - Le push final est fait par le step déterministe Step 5 = signal GATHER
#
# PROMPT env var est consommé pour workflow_dispatch events (REPO_EVENTS path)
# TOKEN = variable lue par useEnvGithubToken() dans github.ts

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      task_id:
        required: true
        type: string
      file:
        required: true
        type: string
      content:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [DÉTERMINISTE] Checkout de la branche base (feature/issue-N)
      # C'est le point de départ de la branche task — contient les merges précédents
      - name: Checkout branch base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      # [DÉTERMINISTE] Création + push de la branche task isolée depuis branch_base
      # isMock=false → l'action configure git elle-même (configureGit skippé uniquement si isMock)
      # On configure ici pour le step params.json
      - name: Create task branch
        run: |
          git config user.name "oneticket-bot"
          git config user.email "oneticket-bot@users.noreply.github.com"
          git checkout -b ${{ inputs.branch }}
          git push origin ${{ inputs.branch }}

      # [DÉTERMINISTE] Matérialise les inputs en tasks/issue-<N>/params.json
      # Commité sur la branche task/* pour audit et traçabilité
      - name: Write and commit params.json
        run: |
          mkdir -p tasks/issue-${{ inputs.issue_number }}
          printf '{\n  "task_id": "%s",\n  "file": "%s",\n  "content": "%s",\n  "branch": "%s",\n  "branch_base": "%s"\n}\n' \
            "${{ inputs.task_id }}" \
            "${{ inputs.file }}" \
            "${{ inputs.content }}" \
            "${{ inputs.branch }}" \
            "${{ inputs.branch_base }}" > tasks/issue-${{ inputs.issue_number }}/params.json
          echo "params.json :"
          cat tasks/issue-${{ inputs.issue_number }}/params.json
          git add tasks/issue-${{ inputs.issue_number }}/params.json
          git commit -m "chore: add params.json for task ${{ inputs.task_id }}"
          git push origin ${{ inputs.branch }}

      # [LLM] Seule zone non-déterministe.
      # workflow_dispatch → chemin REPO_EVENTS → PROMPT requis et consommé
      # L'action crée opencode/dispatch-* (fantôme local)
      # Prompt force git checkout task/* → branchIsDirty() détecte switched=true
      # → PAS de push ni PR par l'action
      # USE_GITHUB_TOKEN=true → skippe OIDC exchange, utilise GITHUB_TOKEN directement
      - name: Run agent via anomalyco
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          SHARE: "false"
          MODEL: opencode/claude-haiku-4-5
          PROMPT: >-
            FIRST ACTION - no exception: run bash command: git checkout ${{ inputs.branch }}.
            Then read tasks/issue-${{ inputs.issue_number }}/params.json.
            Create the file at the path in params.json field file with the content in params.json field content.
            Then append exactly this line at the end of tasks/issue-${{ inputs.issue_number }}/workflow.md:
            $(date -u '+%Y-%m-%d %H:%M') | ${{ inputs.task_id }} | ${{ inputs.file }}
            Commit all changes with message: feat: complete task ${{ inputs.task_id }}.
            Do NOT push. Do NOT create a PR. Do nothing else.
        with:
          model: opencode/claude-haiku-4-5
          share: false
          use_github_token: true
          prompt: >-
            FIRST ACTION - no exception: run bash command: git checkout ${{ inputs.branch }}.
            Then read tasks/issue-${{ inputs.issue_number }}/params.json.
            Create the file at the path in params.json field file with the content in params.json field content.
            Then append exactly this line at the end of tasks/issue-${{ inputs.issue_number }}/workflow.md:
            $(date -u '+%Y-%m-%d %H:%M') | ${{ inputs.task_id }} | ${{ inputs.file }}
            Commit all changes with message: feat: complete task ${{ inputs.task_id }}.
            Do NOT push. Do NOT create a PR. Do nothing else.

      # [DÉTERMINISTE] Push final = signal GATHER
      # L'agent a commité localement sur task/* après git checkout
      # Ce push déclenche on-task-push.yml → orchestrate.mjs
      - name: Push task branch (GATHER signal)
        run: |
          git push origin ${{ inputs.branch }}
