name: Agent Run

# [EXÉCUTION TÂCHE] Déclenché par agent-launcher.mjs via workflow_dispatch.
# Responsabilité unique : préparer le contexte (déterministe) puis déléguer
# la création du fichier témoin à l'agent via anomalyco/opencode/github@latest.
#
# [FAN-OUT receiver] Plusieurs instances tournent en parallèle, une par tâche prête.
# Aucune collision : chaque instance travaille sur sa propre branche task/issue-<N>-<ID>.
#
# Séparation stricte des responsabilités :
#   DÉTERMINISTE (ce workflow) : checkout, création branche, écriture params.json, push initial
#   LLM (anomalyco action)     : lire params.json, créer le fichier texte, commiter + pusher
#   GATHER (on-task-push.yml)  : déclenché par le push de l'agent sur task/*

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      task_id:
        required: true
        type: string
      file:
        required: true
        type: string
      content:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: true
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # [DÉTERMINISTE] Checkout de la branche base (feature/issue-<N>)
      - name: Checkout branch base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      # [DÉTERMINISTE] Création + push de la branche task isolée depuis branch_base
      # Chaque tâche a sa propre branche — aucune interférence entre tâches parallèles
      - name: Create task branch
        run: |
          git config user.name "oneticket-bot"
          git config user.email "oneticket-bot@users.noreply.github.com"
          git checkout -b ${{ inputs.branch }}
          git push origin ${{ inputs.branch }}

      # [DÉTERMINISTE] Matérialise les inputs en params.json
      # Seul canal de communication vers l'agent — pas de variables d'env complexes
      - name: Write params.json
        run: |
          cat > params.json << 'EOF'
          {
            "task_id": "${{ inputs.task_id }}",
            "file": "${{ inputs.file }}",
            "content": "${{ inputs.content }}",
            "branch": "${{ inputs.branch }}",
            "branch_base": "${{ inputs.branch_base }}"
          }
          EOF

      # [LLM] Seule zone non-déterministe.
      # L'agent lit params.json, crée le fichier texte, commite et pushe.
      # Le push sur task/* est le signal GATHER → déclenche on-task-push.yml → orchestrate.mjs
      - name: Run agent via anomalyco
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        with:
          share: false
          prompt: >
            Read the file params.json at the root of the repository.
            Create the file at the path specified in params.json["file"]
            with the content specified in params.json["content"].
            Commit with message "feat: complete task ${{ inputs.task_id }}".
            Push to the branch specified in params.json["branch"].
            Do nothing else.
