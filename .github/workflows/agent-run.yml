name: Agent Run

# [EXÉCUTION TÂCHE] Déclenché par agent-launcher.mjs via workflow_dispatch.
#
# Architecture :
#   DÉTERMINISTE : checkout, création branche task/*, params.json, push final (signal GATHER)
#   LLM (anomalyco) : lire params.json, créer le fichier texte, commiter UNIQUEMENT
#
# Mécanisme anti-PR :
#   - workflow_dispatch est supporté nativement par l'action (REPO_EVENTS)
#   - L'action crée opencode/dispatch-* localement (fantôme, jamais pushée)
#   - Le prompt force git checkout task/* en première action
#   - branchIsDirty() détecte switched=true → PAS de push ni PR par l'action
#   - Le push final est fait par le step déterministe Step 5 = signal GATHER
#
# PROMPT env var est consommé pour workflow_dispatch events (REPO_EVENTS path)
# TOKEN = variable lue par useEnvGithubToken() dans github.ts

on:
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
        type: string
      task_id:
        required: true
        type: string
      file:
        required: true
        type: string
      content:
        required: true
        type: string
      branch:
        required: true
        type: string
      branch_base:
        required: true
        type: string
      retry_count:
        required: false
        type: string
        default: "0"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      # [DÉTERMINISTE] Checkout de la branche base (feature/issue-N)
      # C'est le point de départ de la branche task — contient les merges précédents
      - name: Checkout branch base
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_base }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      # [DÉTERMINISTE] Création + push de la branche task isolée depuis branch_base
      # Si la branche existe déjà (double-lancement rare), on la checkoute sans recréer
      - name: Create task branch
        run: |
          git config user.name "oneticket-bot"
          git config user.email "oneticket-bot@users.noreply.github.com"
          if git ls-remote --heads origin ${{ inputs.branch }} | grep -q ${{ inputs.branch }}; then
            echo "Branche ${{ inputs.branch }} existe déjà, checkout."
            git fetch origin ${{ inputs.branch }}
            git checkout -B ${{ inputs.branch }} origin/${{ inputs.branch }}
          else
            git checkout -b ${{ inputs.branch }}
            git push origin ${{ inputs.branch }}
          fi

      # [DÉTERMINISTE] Matérialise les inputs en tasks/issue-<N>/params-<ID>.json
      # Nommé par tâche (params-A.json, params-B.json...) pour éviter les conflits
      # add/add au merge quand plusieurs tâches parallèles créent chacune un params.json
      # Commité sur la branche task/* pour audit et traçabilité
      - name: Write and commit params.json
        run: |
          mkdir -p tasks/issue-${{ inputs.issue_number }}
          printf '{\n  "task_id": "%s",\n  "file": "%s",\n  "content": "%s",\n  "branch": "%s",\n  "branch_base": "%s"\n}\n' \
            "${{ inputs.task_id }}" \
            "${{ inputs.file }}" \
            "${{ inputs.content }}" \
            "${{ inputs.branch }}" \
            "${{ inputs.branch_base }}" > tasks/issue-${{ inputs.issue_number }}/params-${{ inputs.task_id }}.json
          echo "params-${{ inputs.task_id }}.json :"
          cat tasks/issue-${{ inputs.issue_number }}/params-${{ inputs.task_id }}.json
          git add tasks/issue-${{ inputs.issue_number }}/params-${{ inputs.task_id }}.json
          git commit --allow-empty -m "chore: add params.json for task ${{ inputs.task_id }}"
          git push origin ${{ inputs.branch }}

      # [LLM] Seule zone non-déterministe.
      # workflow_dispatch → chemin REPO_EVENTS → PROMPT requis et consommé
      # L'action crée opencode/dispatch-* (fantôme local)
      # Prompt force git checkout task/* → branchIsDirty() détecte switched=true
      # → PAS de push ni PR par l'action
      # USE_GITHUB_TOKEN=true → skippe OIDC exchange, utilise GITHUB_TOKEN directement
      # continue-on-error: true → permet au step de retry de s'exécuter en cas d'échec
      - name: Run agent via anomalyco
        id: run-agent
        continue-on-error: true
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          SHARE: "false"
          MODEL: opencode/claude-haiku-4-5
          PROMPT: >-
            FIRST ACTION - no exception: run bash command: git checkout ${{ inputs.branch }}.
            Read tasks/issue-${{ inputs.issue_number }}/params-${{ inputs.task_id }}.json.
            Create the file specified in field "file" with the content specified in field "content".
            Run this exact bash command (do not modify it):
            echo "$(date -u '+%Y-%m-%d %H:%M') | ${{ inputs.task_id }} | ${{ inputs.file }}" >> tasks/issue-${{ inputs.issue_number }}/workflow.md
            Commit all changes with message: feat: complete task ${{ inputs.task_id }}.
            Do NOT push. Do NOT create a PR. Do nothing else.
        with:
          model: opencode/claude-haiku-4-5
          share: false
          use_github_token: true
          prompt: >-
            FIRST ACTION - no exception: run bash command: git checkout ${{ inputs.branch }}.
            Read tasks/issue-${{ inputs.issue_number }}/params-${{ inputs.task_id }}.json.
            Create the file specified in field "file" with the content specified in field "content".
            Run this exact bash command (do not modify it):
            echo "$(date -u '+%Y-%m-%d %H:%M') | ${{ inputs.task_id }} | ${{ inputs.file }}" >> tasks/issue-${{ inputs.issue_number }}/workflow.md
            Commit all changes with message: feat: complete task ${{ inputs.task_id }}.
            Do NOT push. Do NOT create a PR. Do nothing else.

      # [RETRY] Si anomalyco échoue (ex: rate-limit GitHub API sur curl releases/latest)
      # et que retry_count < 3 → re-dispatch ce même workflow avec retry_count+1 et exit 0.
      # Délai croissant : 10s × retry_count pour laisser passer le rate-limit.
      # Si retry_count >= 3 → échec définitif (exit 1).
      - name: Retry on agent failure
        if: steps.run-agent.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          RETRY=${{ inputs.retry_count }}
          echo "[retry] Agent a échoué. retry_count=$RETRY"
          if [ "$RETRY" -ge 3 ]; then
            echo "[retry] Max retries atteint (3). Échec définitif."
            exit 1
          fi
          NEXT_RETRY=$((RETRY + 1))
          DELAY=$((NEXT_RETRY * 10))
          echo "[retry] Attente ${DELAY}s avant re-dispatch (tentative $NEXT_RETRY/3)..."
          sleep $DELAY
          gh workflow run agent-run.yml \
            --repo ${{ github.repository }} \
            --field issue_number=${{ inputs.issue_number }} \
            --field task_id=${{ inputs.task_id }} \
            --field file="${{ inputs.file }}" \
            --field content="${{ inputs.content }}" \
            --field branch=${{ inputs.branch }} \
            --field branch_base=${{ inputs.branch_base }} \
            --field retry_count=$NEXT_RETRY
          echo "[retry] Re-dispatch déclenché (tentative $NEXT_RETRY/3). Ce run se termine proprement."

      # [DÉTERMINISTE] Push final = signal GATHER
      # L'agent a commité localement sur task/* après git checkout
      # Ce push déclenche on-task-push.yml → orchestrate.mjs
      # Skippé si l'agent a échoué (le retry prend le relais)
      - name: Push task branch (GATHER signal)
        if: steps.run-agent.outcome == 'success'
        run: |
          git push origin ${{ inputs.branch }}

  # [FAILURE NOTIFICATION] Posté sur l'issue si le job run-agent échoue définitivement
  # (max retries atteint ou erreur non-recoverable sur les steps déterministes).
  # Fournit le lien direct vers le run Actions pour faciliter le debug.
  notify-failure:
    needs: run-agent
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ inputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Agent Run failure — tâche \`${{ inputs.task_id }}\`

          Le workflow d'exécution de la tâche **${{ inputs.task_id }}** a échoué (retry_count=${{ inputs.retry_count }}).

          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > La tâche reste en état \`in_progress\` dans le manifest. Intervention manuelle requise."
