name: Build & Deploy monjournal

on:
  push:
    branches: [main]
    paths:
      - 'apps/monjournal/app/**'
      - '.github/workflows/deploy-monjournal.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/monjournal/app
    
    outputs:
      bundle-size: ${{ steps.bundle-check.outputs.size }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'apps/monjournal/app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_APP_TITLE: "Journal Personnel"

      - name: Check bundle size
        id: bundle-check
        run: |
          # Get gzipped size of the main bundle
          if [ -f dist/index.html ]; then
            echo "Build output found in dist/"
            ls -lh dist/ || true
            
            # Calculate total gzipped size
            TOTAL_SIZE=$(find dist -type f \( -name "*.js" -o -name "*.css" \) -exec gzip -c {} \; | wc -c)
            TOTAL_KB=$((TOTAL_SIZE / 1024))
            echo "Total gzipped bundle size: ${TOTAL_KB} KB"
            
            if [ $TOTAL_SIZE -gt 524288 ]; then
              echo "❌ Bundle size exceeds 500 KB gzipped (${TOTAL_KB} KB)"
              exit 1
            else
              echo "✓ Bundle size is within limit (${TOTAL_KB} KB < 500 KB)"
            fi
            
            echo "size=${TOTAL_KB}KB" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed - dist/index.html not found"
            exit 1
          fi

      - name: Run E2E tests (optional)
        id: e2e-tests
        continue-on-error: true
        run: |
          npm run test:e2e -- --reporter=github || true
          echo "e2e_status=$?" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monjournal-dist
          path: apps/monjournal/app/dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    defaults:
      run:
        working-directory: apps/monjournal/app

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: monjournal-dist
          path: apps/monjournal/app/dist

      - name: Log deployment info
        run: |
          echo "📦 Bundle size: ${{ needs.build.outputs.bundle-size }}"
          echo "🚀 Deploying to GitHub Pages..."
          echo ""
          echo "Dist folder contents:"
          ls -lhR dist/ | head -30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/monjournal/app/dist
          cname: ""

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Verify deployment
        id: deployment
        run: |
          echo "✓ Deployment initiated"
          echo "📍 GitHub Pages URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/monjournal/"

      - name: Smoke test - Check deployment
        run: |
          echo "ℹ️  Deployment logs:"
          echo "- Publish directory: ./apps/monjournal/app/dist"
          echo "- Branch: gh-pages"
          echo "- Check GitHub repository settings > Pages for live URL"
          echo ""
          echo "✓ If you see this, deployment workflow completed successfully"

      - name: Comment on deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const bundleSize = '${{ needs.build.outputs.bundle-size }}';
            const deploymentUrl = 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/monjournal/';
            
            const body = status === 'success'
              ? `✅ **Deployment Successful**\n\n📦 Bundle Size: ${bundleSize}\n🌍 Live URL: ${deploymentUrl}\n\n> View GitHub Actions logs for detailed output.`
              : `❌ **Deployment Failed**\n\nCheck GitHub Actions logs for details.`;
            
            if (context.issue.number) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
