name: Deploy Doc Site

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'feature/**'
    paths:
      - '.oneticket/docs/**'
      - 'apps/**/docs/**'
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.oneticket/docs/**'
      - 'apps/**/docs/**'

permissions:
  contents: write
  pull-requests: write

jobs:

  resolve-context:
    runs-on: ubuntu-latest
    outputs:
      doc_source:      ${{ steps.ctx.outputs.doc_source }}
      slug:            ${{ steps.ctx.outputs.slug }}
      astro_base:      ${{ steps.ctx.outputs.astro_base }}
      target_folder:   ${{ steps.ctx.outputs.target_folder }}
      app_url:         ${{ steps.ctx.outputs.app_url }}
      current_project: ${{ steps.ctx.outputs.current_project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Resolve context
        id: ctx
        run: |
          # Deduce DOC_SOURCE from changed files — independent of config.yml
          # For pull_request: compare PR head against base
          # For push: compare HEAD against previous commit
          # For tags: fall back to config.yml (full rebuild on release)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || true)
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.before }} HEAD 2>/dev/null || true)
          else
            CHANGED=""
          fi

          # Derive PROJECT and DOC_SOURCE from changed paths
          if echo "$CHANGED" | grep -q "^\.oneticket/docs/"; then
            PROJECT="oneticket-core"
            DOC_SOURCE=".oneticket/docs"
          elif echo "$CHANGED" | grep -qE "^apps/[^/]+/docs/"; then
            PROJECT=$(echo "$CHANGED" | grep -oE "^apps/[^/]+/docs/" | head -1 | cut -d/ -f2)
            DOC_SOURCE="apps/$PROJECT/docs"
          else
            # Fallback to config.yml (e.g. tag push with no CHANGED)
            PROJECT=$(node src/print-config.mjs current_project)
            if [ "$PROJECT" = "oneticket-core" ] || [ -z "$PROJECT" ]; then
              DOC_SOURCE=".oneticket/docs"
              PROJECT="oneticket-core"
            else
              DOC_SOURCE="apps/$PROJECT/docs"
            fi
          fi

          # oneticket-core → slug 'framework' to avoid /oneticket-core/oneticket-core/ in URL
          if [ "$PROJECT" = "oneticket-core" ] || [ -z "$PROJECT" ]; then
            SLUG="framework"
          else
            SLUG="$PROJECT"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR=${{ github.event.pull_request.number }}
            ASTRO_BASE="/oneticket-core/$SLUG/pr/$PR/docs"
            TARGET="$SLUG/pr/$PR/docs"
            if [ "$SLUG" != "framework" ]; then
              APP_URL="https://dsissoko.github.io/oneticket-core/$SLUG/pr/$PR/app"
            else
              APP_URL=""
            fi
          else
            ASTRO_BASE="/oneticket-core/$SLUG/docs"
            TARGET="$SLUG/docs"
            if [ "$SLUG" != "framework" ]; then
              APP_URL="https://dsissoko.github.io/oneticket-core/$SLUG/app"
            else
              APP_URL=""
            fi
          fi

          echo "doc_source=$DOC_SOURCE"     >> $GITHUB_OUTPUT
          echo "slug=$SLUG"                 >> $GITHUB_OUTPUT
          echo "astro_base=$ASTRO_BASE"     >> $GITHUB_OUTPUT
          echo "target_folder=$TARGET"      >> $GITHUB_OUTPUT
          echo "app_url=$APP_URL"           >> $GITHUB_OUTPUT
          echo "current_project=$PROJECT"   >> $GITHUB_OUTPUT

  build-doc-site:
    needs: resolve-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: doc-site
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: doc-site
        run: npx playwright install chromium --with-deps
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Extract site description
        id: site-desc
        run: |
          SPEC="${{ needs.resolve-context.outputs.doc_source }}/what/product-spec.md"
          DESC=""
          if [ -f "$SPEC" ]; then
            RAW=$(grep -o 'SITE_DESCRIPTION:.*' "$SPEC" | head -1 | sed 's/SITE_DESCRIPTION: *//' | sed 's/ -->//' | cut -c1-160)
            if [[ "$RAW" != *"<!--"* && -n "$RAW" ]]; then
              DESC="$RAW"
            fi
          fi
          echo "description=${DESC:-Documentation for ${{ needs.resolve-context.outputs.current_project }}}" >> $GITHUB_OUTPUT
      - name: Build
        working-directory: doc-site
        env:
          DOC_SOURCE:          ${{ needs.resolve-context.outputs.doc_source }}
          ASTRO_SITE:          https://dsissoko.github.io/oneticket-core
          ASTRO_BASE:          ${{ needs.resolve-context.outputs.astro_base }}
          CURRENT_PROJECT:     ${{ needs.resolve-context.outputs.current_project }}
          SITE_DESCRIPTION:    ${{ steps.site-desc.outputs.description }}
          PUBLIC_BRANCH:       ${{ github.ref_name }}
          PUBLIC_COMMIT_SHA:   ${{ github.sha }}
          PUBLIC_TAG:          ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
          PUBLIC_BUILD_DATE:   ${{ env.BUILD_DATE }}
          PUBLIC_APP_URL:      ${{ needs.resolve-context.outputs.app_url }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: doc-site-static
          path: doc-site/dist/

  deploy-preview:
    needs: [resolve-context, build-doc-site]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: doc-site-static
          path: dist/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          token:         ${{ secrets.ONETICKET_GH_PAT }}
          folder:        dist
          target-folder: ${{ needs.resolve-context.outputs.target_folder }}
          clean:         false
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: doc-preview
          message: |
            📖 **Doc preview:** https://dsissoko.github.io/oneticket-core/${{ needs.resolve-context.outputs.target_folder }}/

  deploy-prod:
    needs: [resolve-context, build-doc-site]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: doc-site-static
          path: dist/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          token:         ${{ secrets.ONETICKET_GH_PAT }}
          folder:        dist
          target-folder: ${{ needs.resolve-context.outputs.target_folder }}
          clean:         true
          clean-exclude: |
            .nojekyll
            pr
