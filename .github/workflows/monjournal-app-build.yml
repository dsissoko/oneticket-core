name: Build monjournal app

# Delegated build workflow — called by docs-site-github-pages.yml
# Convention: {project}-app-build.yml
# Generated pattern: @dev produces this file guided by oneticket-app-build skill

on:
  workflow_call:
    inputs:
      app_path:
        required: true
        type: string
        description: "Path to the app directory (e.g. apps/monjournal/app)"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app_path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.app_path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-static
          path: ${{ inputs.app_path }}/dist/
          if-no-files-found: error
          retention-days: 7
