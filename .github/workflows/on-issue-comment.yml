name: Comment Dispatcher

# [DÉTERMINISTE] Point d'entrée des invocations agents via commentaires GitHub.
#
# Trigger : issue_comment (commentaire sur une issue, pas une PR)
#
# Responsabilités de ce workflow :
#   1. Filtrer : commentaire @<role> sur une issue (pas PR)
#   2. Construire CONTEXT_BLOCK — contexte spécifique à ce trigger
#   3. Déléguer à agent-dispatch.mjs avec le contrat d'interface minimal
#
# Contrat d'interface vers agent-dispatch.mjs :
#   COMMENT_BODY   — texte du commentaire (contient @<role> + demande)
#   ISSUE_NUMBER   — numéro d'issue
#   REPO           — owner/repo
#   CONTEXT_BLOCK  — contexte construit par ce workflow (spécifique issue_comment)
#
# Extensibilité : pour un nouveau trigger (PR comment, label, etc.),
# créer un nouveau workflow qui expose le même contrat + son propre CONTEXT_BLOCK.
# agent-dispatch.mjs ne change pas.
#
# [IDEMPOTENCE] Sérialise les déclenchements sur la même issue
# Les issues différentes restent parallèles entre elles

on:
  issue_comment:
    types: [created]

concurrency:
  group: dispatch-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Filtre : commentaire @<role> sur une issue (pas PR)
    if: "github.event.issue.pull_request == null && startsWith(github.event.comment.body, '@')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Construit le CONTEXT_BLOCK spécifique au trigger issue_comment.
      # Ce bloc sera inséré tel quel dans le prompt système par agent-dispatch.mjs.
      # Chaque trigger est libre de construire son propre format.
      - name: Build context block
        id: context
        run: |
          CONTEXT=$(cat <<'CONTEXT_EOF'
          ## Contexte de l'issue #${{ github.event.issue.number }}
          **Titre :** ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          CONTEXT_EOF
          )
          # Encode en base64 pour éviter les problèmes de caractères spéciaux
          echo "block=$(echo "$CONTEXT" | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Dispatch agent
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          CONTEXT_BLOCK: ${{ steps.context.outputs.block }}
        run: |
          # Décoder le CONTEXT_BLOCK avant de passer à agent-dispatch.mjs
          export CONTEXT_BLOCK=$(echo "$CONTEXT_BLOCK" | base64 -d)
          node src/agent-dispatch.mjs

  # [FAILURE NOTIFICATION] Posté sur l'issue si le dispatch échoue
  notify-failure:
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "## Dispatch failure

          Le workflow de dispatch a échoué lors du traitement de votre commande.

          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Vérifier les logs du run pour identifier la cause."
