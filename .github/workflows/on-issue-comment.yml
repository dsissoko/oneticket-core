name: Comment Dispatcher

# [DÉTERMINISTE] Point d'entrée des invocations agents via commentaires GitHub.
#
# Déclenché sur tout commentaire commençant par / dans une issue (pas une PR).
# Délègue à agent-dispatch.mjs qui :
#   1. Parse le commentaire → role + demande
#   2. Crée feature/issue-N si elle n'existe pas
#   3. Construit le prompt complet
#   4. Dispatche Agent Execute (workflow_dispatch)
#
# [IDEMPOTENCE] Sérialise les déclenchements sur la même issue
# Les issues différentes restent parallèles entre elles

on:
  issue_comment:
    types: [created]

concurrency:
  group: dispatch-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Ne se déclenche que sur un commentaire /role dans une issue (pas PR)
    if: "github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Dispatch agent
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
        run: node src/agent-dispatch.mjs

  # [FAILURE NOTIFICATION] Posté sur l'issue si le dispatch échoue
  notify-failure:
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "## Dispatch failure

          Le workflow de dispatch a échoué lors du traitement de votre commande.

          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Vérifier les logs du run pour identifier la cause."
