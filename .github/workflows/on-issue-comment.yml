name: Comment Dispatcher

# [DETERMINISTIC] Entry point for agent invocations via GitHub comments.
#
# Trigger: issue_comment (comment on an issue, not a PR)
#
# Workflow responsibilities:
#   1. Filter: @<role> comment on an issue (not a PR)
#   2. Build CONTEXT_BLOCK — context specific to this trigger
#   3. Delegate to agent-dispatch.mjs with the minimal interface contract
#
# Interface contract toward agent-dispatch.mjs:
#   COMMENT_BODY   — comment text (contains @<role> + request)
#   ISSUE_NUMBER   — issue number
#   REPO           — owner/repo
#   CONTEXT_BLOCK  — context built by this workflow (specific to issue_comment)
#
# Extensibility: to add a new trigger (PR comment, label, etc.),
# create a new workflow that exposes the same contract + its own CONTEXT_BLOCK.
# agent-dispatch.mjs does not change.
#
# [IDEMPOTENCE] Serializes dispatches on the same issue
# Different issues remain parallel

on:
  issue_comment:
    types: [created]

concurrency:
  group: dispatch-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Filter: @<role> comment on an issue (not a PR)
    if: "github.event.issue.pull_request == null && startsWith(github.event.comment.body, '@')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Builds the CONTEXT_BLOCK specific to the issue_comment trigger.
      # Fetches comment history via GitHub API (last COMMENT_HISTORY_MAX comments).
      # Constants: src/constants.mjs — COMMENT_HISTORY_MAX, COMMENT_BODY_MAX_CHARS
      - name: Build context block
        id: context
        env:
          GITHUB_TOKEN:       ${{ secrets.ONETICKET_GH_PAT }}
          REPO:               ${{ github.repository }}
          ORIGIN_TYPE:        issue_comment
          ISSUE_NUMBER:       ${{ github.event.issue.number }}
          CURRENT_COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_TITLE:        ${{ github.event.issue.title }}
          ISSUE_BODY:         ${{ github.event.issue.body }}
        run: |
          echo "block=$(node src/build-context.mjs)" >> $GITHUB_OUTPUT

      - name: Dispatch agent
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          CONTEXT_BLOCK: ${{ steps.context.outputs.block }}
          ORIGIN_TYPE: issue_comment
        run: |
          export CONTEXT_BLOCK=$(echo "$CONTEXT_BLOCK" | base64 -d)
          node src/agent-dispatch.mjs

  # [FAILURE NOTIFICATION] Posted on the issue if dispatch fails
  notify-failure:
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "## Dispatch failure

          The dispatch workflow failed while processing your command.

          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Check the run logs to identify the cause."
