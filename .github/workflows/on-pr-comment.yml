name: PR Comment Dispatcher

# [DETERMINISTIC] Entry point for agent invocations via PR comments.
#
# Trigger: issue_comment on a pull_request (GitHub routes PR comments through issue_comment)
#
# Workflow responsibilities:
#   1. Filter: @<role> comment on a PR
#   2. Build CONTEXT_BLOCK with origin_type=pull_request_comment + pr context
#   3. Delegate to agent-dispatch.mjs with the standard interface contract
#
# Interface contract toward agent-dispatch.mjs:
#   COMMENT_BODY   — comment text (contains @<role> + request)
#   ISSUE_NUMBER   — PR number (used as issue_number for branch naming)
#   REPO           — owner/repo
#   CONTEXT_BLOCK  — context built by this workflow, includes origin_type + pr_number
#
# agent-dispatch.mjs reads origin_type from CONTEXT_BLOCK to inject the correct
# gh pr comment command in ## Agent contract.

on:
  issue_comment:
    types: [created]

concurrency:
  group: dispatch-pr-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Filter: @<role> comment on a PR only
    if: "github.event.issue.pull_request != null && startsWith(github.event.comment.body, '@')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build context block
        id: context
        run: |
          CONTEXT=$(cat <<'CONTEXT_EOF'
          ## Context for PR #${{ github.event.issue.number }}
          **Title:** ${{ github.event.issue.title }}

          ${{ github.event.issue.body }}
          CONTEXT_EOF
          )
          echo "block=$(echo "$CONTEXT" | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Dispatch agent
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          CONTEXT_BLOCK: ${{ steps.context.outputs.block }}
          ORIGIN_TYPE: pull_request_comment
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          export CONTEXT_BLOCK=$(echo "$CONTEXT_BLOCK" | base64 -d)
          node src/agent-dispatch.mjs

  notify-failure:
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on PR
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh pr comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "## Dispatch failure

          The dispatch workflow failed while processing your command.

          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
