name: Workflow Gather

# [DETERMINISTIC] Collects task completion signals and orchestrates next steps.
# Triggered when agent-execute.yml opens a PR from task/* into feature/issue-N.
#
# The PR is the unambiguous completion signal — it is opened AFTER the agent
# has committed its files, never before. This eliminates the race condition
# where a branch creation push would trigger the GATHER before the agent worked.
#
# Security: validate-task-branch.mjs ensures task/issue-N-X only merges
# into feature/issue-N — never into another issue or main.
#
# Pattern: Scatter/Gather — this workflow is the Gather + FAN-IN + optional re-Scatter
#
# [CONCURRENCY] No GitHub concurrency here — manifest access conflicts
# are handled in orchestrate.mjs with push retry (optimistic git lock).

on:
  pull_request:
    types: [opened]
    branches:
      - 'feature/issue-*'

jobs:
  # [VALIDATE + PARSE] Validates branch coherence and extracts issue number
  # Rejects any PR that is not a task/* → feature/issue-N completion signal
  extract:
    if: "startsWith(github.head_ref, 'task/')"
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.validate.outputs.issue_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --silent

      - name: Validate branch coherence
        id: validate
        run: |
          node src/validate-task-branch.mjs "${{ github.head_ref }}" "${{ github.base_ref }}"
          ISSUE=$(echo "${{ github.head_ref }}" | sed 's/task\/issue-\([0-9]*\)-.*/\1/')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

  orchestrate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # [DETERMINISTIC ROUTING] orchestrate.mjs decides next steps — never the LLM
      # Git conflicts (non-fast-forward push) are handled with retry in JS code
      - name: Run orchestrator — merge, update manifest, route or create PR
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          TASK_BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node src/orchestrate.mjs

  # [FAILURE NOTIFICATION] Posted on the issue if the orchestrate job fails.
  notify-failure:
    needs: [extract, orchestrate]
    if: failure() && needs.extract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ needs.extract.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Orchestration failure — branch \`${{ github.head_ref }}\`

          The orchestration workflow failed while processing the GATHER signal.

          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Check the run logs to identify the cause (merge conflict, corrupted manifest, network error)."
