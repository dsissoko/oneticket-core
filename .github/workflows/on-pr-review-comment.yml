name: PR Review Comment Dispatcher

# [DETERMINISTIC] Entry point for agent invocations via inline PR review comments.
#
# Trigger: pull_request_review_comment (comment on a specific line of code in a PR diff)
#
# Parse level 1 — Deterministic commands: none (PR context — branch exists)
# Parse level 2 — Agentic: build-context.mjs → agent-dispatch.mjs

on:
  pull_request_review_comment:
    types: [created]

concurrency:
  group: dispatch-review-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: "startsWith(github.event.comment.body, '@')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # head.ref is natively available in pull_request_review_comment payload — no API call needed.
      # Guard: if head.ref does not match feature/issue-N, skip with a comment.
      - name: Resolve issue number from PR head ref
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          if echo "$HEAD_REF" | grep -qE '^feature/issue-[0-9]+$'; then
            ISSUE_NUMBER=$(echo "$HEAD_REF" | sed 's/feature\/issue-//')
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "Cannot dispatch agent — PR branch \`${HEAD_REF}\` does not follow the \`feature/issue-N\` naming convention."
          fi

      - name: Build context block
        if: steps.resolve.outputs.valid == 'true'
        id: context
        env:
          GITHUB_TOKEN:       ${{ secrets.ONETICKET_GH_PAT }}
          REPO:               ${{ github.repository }}
          ORIGIN_TYPE:        pull_request_review_comment
          ISSUE_NUMBER:       ${{ steps.resolve.outputs.issue_number }}
          CURRENT_COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_TITLE:        ${{ github.event.pull_request.title }}
          ISSUE_BODY:         ${{ github.event.pull_request.body }}
          COMMENT_PATH:       ${{ github.event.comment.path }}
          COMMENT_LINE:       ${{ github.event.comment.line }}
          COMMENT_DIFF_HUNK:  ${{ github.event.comment.diff_hunk }}
          COMMENT_BODY:       ${{ github.event.comment.body }}
        run: |
          echo "block=$(node src/build-context.mjs)" >> $GITHUB_OUTPUT

      - name: Dispatch agent
        if: steps.resolve.outputs.valid == 'true'
        env:
          GITHUB_TOKEN:        ${{ secrets.ONETICKET_GH_PAT }}
          ISSUE_NUMBER:        ${{ steps.resolve.outputs.issue_number }}
          COMMENT_BODY:        ${{ github.event.comment.body }}
          REPO:                ${{ github.repository }}
          CONTEXT_BLOCK:       ${{ steps.context.outputs.block }}
          ORIGIN_TYPE:         pull_request_review_comment
          PR_NUMBER:           ${{ github.event.pull_request.number }}
          REPLY_TO_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          export CONTEXT_BLOCK=$(echo "$CONTEXT_BLOCK" | base64 -d)
          node src/agent-dispatch.mjs

  notify-failure:
    needs: dispatch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on PR
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Dispatch failure

          The dispatch workflow failed while processing your inline review command.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
