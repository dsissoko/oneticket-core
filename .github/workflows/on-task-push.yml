name: Workflow Gather

# [DETERMINISTIC] Collects task completion signals and orchestrates next steps.
# Triggered by the deterministic final push from agent-execute.yml (step "Push branch").
#
# Every push on task/** is a legitimate task completion signal — no filter
# on commit message. The pipeline must not depend on an agent decision.
# chore: pushes (manifest in_progress) happen on feature/issue-N, never on task/**.
#
# Pattern: Scatter/Gather — this workflow is the Gather + FAN-IN + optional re-Scatter
#
# [CONCURRENCY] No GitHub concurrency here — manifest access conflicts
# are handled in orchestrate.mjs with push retry (optimistic git lock).
# Reason: GitHub job-level concurrency only offers one queue slot —
# if two runs arrive near-simultaneously, one is cancelled even with cancel-in-progress: false.
# Git retry is more reliable as it loses no signal.

on:
  push:
    branches:
      - 'task/**'

jobs:
  # [PARSE] Extracts the issue number from the pushed branch name
  # e.g. task/issue-42-A → 42
  extract:
    # Ignore branch creation pushes — only process pushes with new commits from the agent
    # github.event.created == true means this is a branch creation push (no agent work yet)
    if: "github.event.created == false"
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - id: parse
        run: |
          BRANCH="${{ github.ref_name }}"
          ISSUE=$(echo "$BRANCH" | sed 's/task\/issue-\([0-9]*\)-.*/\1/')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

  orchestrate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # [DETERMINISTIC ROUTING] orchestrate.mjs decides next steps — never the LLM
      # Git conflicts (non-fast-forward push) are handled with retry in JS code
      - name: Run orchestrator — merge, update manifest, route or create PR
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          PUSHED_BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node src/orchestrate.mjs

  # [FAILURE NOTIFICATION] Posted on the issue if the orchestrate job fails.
  # Issue number is extracted from the branch name (same logic as the extract job).
  notify-failure:
    needs: [extract, orchestrate]
    if: failure() && needs.extract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ needs.extract.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Orchestration failure — branch \`${{ github.ref_name }}\`

          The orchestration workflow failed while processing the GATHER signal.

          **Actions run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Check the run logs to identify the cause (merge conflict, corrupted manifest, network error)."
