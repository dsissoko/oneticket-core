name: Workflow Gather

# [DÉTERMINISTE] Collecte les signaux de fin de tâche et orchestre la suite.
# Déclenché par le push final de agent-execute.yml (step "Push branch").
#
# Filtre : seuls les commits dont le message commence par "feat:" déclenchent
# l'orchestration — les pushs de création de branche (message "chore:") sont ignorés.
#
# Pattern : Scatter/Gather — ce workflow est le Gather + FAN-IN + re-Scatter éventuel
#
# [CONCURRENCY] Aucun concurrency GitHub ici — les conflits d'accès au manifest
# sont gérés dans orchestrate.mjs avec retry sur push (lock optimiste git).
# Raison : le concurrency job-level GitHub n'offre qu'une seule place en queue —
# si deux runs arrivent quasi-simultanément, l'un est annulé même avec cancel-in-progress: false.
# Le retry git est plus fiable car il ne perd aucun signal.

on:
  push:
    branches:
      - 'task/**'

jobs:
  # [PARSE] Extrait le numéro d'issue depuis le nom de la branche poussée
  # ex: task/issue-42-A → 42
  extract:
    # [FILTRE GATHER] Ne s'exécute que sur le commit final de l'agent (feat:)
    # Ignore les commits déterministes de setup (chore:) poussés par agent-run.yml
    if: startsWith(github.event.head_commit.message, 'feat:')
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - id: parse
        run: |
          BRANCH="${{ github.ref_name }}"
          ISSUE=$(echo "$BRANCH" | sed 's/task\/issue-\([0-9]*\)-.*/\1/')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

  orchestrate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # [ROUTING DÉTERMINISTE] orchestrate.mjs décide de la suite — jamais le LLM
      # Les conflits git (push non fast-forward) sont gérés avec retry dans le code JS
      - name: Run orchestrator — merge, update manifest, route or create PR
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          PUSHED_BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node src/orchestrate.mjs

  # [FAILURE NOTIFICATION] Posté sur l'issue si le job orchestrate échoue.
  # Le numéro d'issue est extrait du nom de branche (même logique que le job extract).
  notify-failure:
    needs: [extract, orchestrate]
    if: failure() && needs.extract.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post failure comment on issue
        env:
          GH_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
        run: |
          gh issue comment ${{ needs.extract.outputs.issue_number }} \
            --repo ${{ github.repository }} \
            --body "## Orchestration failure — branche \`${{ github.ref_name }}\`

          Le workflow d'orchestration a échoué lors du traitement du signal GATHER.

          **Run Actions :** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          > Vérifier les logs du run pour identifier la cause (merge conflict, manifest corrompu, erreur réseau)."
