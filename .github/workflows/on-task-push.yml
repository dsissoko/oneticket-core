name: On Task Push

# [GATHER] Point de collecte des signaux de fin de tâche.
# Déclenché uniquement par le push FINAL de agent-run.yml (Step déterministe).
#
# IMPORTANT : agent-run.yml pousse plusieurs fois sur task/* :
#   - "chore: add params.json for task X"  → push de setup, NE doit PAS orchestrer
#   - "feat: complete task X"               → push final agent, DOIT orchestrer
#
# Le filtre sur github.event.head_commit.message garantit que seul le signal
# GATHER réel (commit de l'agent) déclenche l'orchestration.
#
# Pattern : Scatter/Gather — ce workflow est le Gather

on:
  push:
    branches:
      - 'task/**'

# [QUEUE GLOBALE] Sérialise TOUS les runs de ce workflow par branche poussée.
# Inclut le job extract — évite qu'un run soit annulé avant même d'atteindre orchestrate.
# Le concurrency sur orchestrate (par issue) garantit en plus la sérialisation intra-issue.
# cancel-in-progress: false → aucun signal de fin ne doit jamais être perdu
concurrency:
  group: on-task-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # [PARSE] Extrait le numéro d'issue depuis le nom de la branche poussée
  # ex: task/issue-42-A → 42
  # Nécessaire pour scoper le concurrency par issue (voir job orchestrate)
  extract:
    # [FILTRE GATHER] Ne s'exécute que sur le commit final de l'agent (feat:)
    # Ignore les commits déterministes de setup (chore:) poussés par agent-run.yml
    if: startsWith(github.event.head_commit.message, 'feat:')
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - id: parse
        run: |
          BRANCH="${{ github.ref_name }}"
          ISSUE=$(echo "$BRANCH" | sed 's/task\/issue-\([0-9]*\)-.*/\1/')
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

  orchestrate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # [QUEUE PAR ISSUE] Sérialise les signaux de fin de la même issue
    # Garantit qu'un seul runner lit/écrit le manifest à la fois pour une issue donnée
    # Les issues différentes orchestrent en parallèle — pas de goulot d'étranglement global
    # cancel-in-progress: false → on attend, on n'annule jamais un signal de fin
    concurrency:
      group: manifest-${{ github.repository }}-${{ needs.extract.outputs.issue_number }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ONETICKET_GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # [ROUTING DÉTERMINISTE] orchestrate.mjs décide de la suite — jamais le LLM
      - name: Run orchestrator — merge, update manifest, route or create PR
        env:
          GITHUB_TOKEN: ${{ secrets.ONETICKET_GH_PAT }}
          PUSHED_BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: node src/orchestrate.mjs
