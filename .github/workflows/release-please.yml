name: Release Please

# TRIGGER MODE — uncomment one option only:

# Option A: on merged PR only (default)
on:
  pull_request:
    types: [closed]
    branches:
      - main

# Option B: on every push to main
# on:
#   push:
#     branches:
#       - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
