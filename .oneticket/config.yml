# OneTicket Core — Central configuration
#
# Single source of truth for all framework parameters.
#
# Two usages:
#   1. Read by JS scripts (src/config.mjs) for deterministic workflows
#   2. agent_config.<cli> section generated at runtime in CI sandbox via
#      src/generate-config.mjs → injected into OPENCODE_CONFIG_CONTENT
#
# The developer's local config (opencode.json) is NOT managed here —
# each developer maintains their own uncommitted local config.

# ---------------------------------------------------------------------------
# Framework parameters
# ---------------------------------------------------------------------------

language: fr
autonomous_mode: false

# CLI used in CI sandbox — determines which agent_config section to use
cli: opencode

# Maximum number of tasks in a manifest — agents must not exceed this limit
max_tasks: 12

# Maximum number of retries on anomalyco failure (Agent Execute)
retry_max: 3

# Maximum number of retries on non-fast-forward push (orchestrate — optimistic git lock)
# Increased to support large graphs with many parallel tasks
orchestrate_retry_max: 5

# Git identity for the oneticket bot in CI sandbox
# Note: distinct from agent profiles (APM) — specific to the framework
oneticket_git_user_name: oneticket-bot
oneticket_git_user_email: oneticket-bot@users.noreply.github.com

# Target branch for final PRs
pr_base: main

# Clear opencode session cache before each agent run.
# true  (default) — fresh session guaranteed, prevents stale context/skills
# false — session persistence enabled, better performance (use when oneticket is stable)
clear_session_cache: true

# Delete .oneticket/tasks/issue-N/ after all tasks are done (no merge-failed).
# false — keep task logs even on success (useful for debugging)
# true  (default) — clean up after success; always preserved on merge-failed
cleanup_on_success: true

# Active user project — determines docs_path and app_path
#
# States:
#   - key absent or empty           → config error — agent stops and notifies user
#   - 'oneticket-core' (special)    → docs_path = .oneticket/docs, app_path = null
#   - any other value (e.g. breakout) → docs_path = apps/<project>/docs
#                                        app_path  = apps/<project>/app
#
# Set to 'oneticket-core' to work on the framework itself.
# Set to your project name (e.g. breakout) to work on an application project.
current_project: oneticket-core

# ---------------------------------------------------------------------------
# Documentation path resolution
# ---------------------------------------------------------------------------
#
# docs_path is resolved deterministically by src/agent-dispatch.mjs
# before being injected into the agent prompt — the agent never resolves it.
#
# Resolution logic (src/agent-dispatch.mjs → resolveProjectContext):
#   - current_project absent or empty   → config error — agent notifies user, stops
#   - current_project = 'oneticket-core' → docs_path = .oneticket/docs (framework special case)
#                                           app_path  = null (no app for the framework)
#   - current_project = 'myapp'          → docs_path = apps/myapp/docs
#                                           app_path  = apps/myapp/app

# ---------------------------------------------------------------------------
# CI agent configuration — generated at runtime via src/generate-config.mjs
# The active key is determined by the `cli` field above.
# The model used by anomalyco is declared here (agent_config.<cli>.model)
# and not in agent profiles (.agent.md) which are reserved for APM.
# ---------------------------------------------------------------------------

agent_config:
  # Config injected via OPENCODE_CONFIG_CONTENT when cli: opencode
  # Format: opencode.json schema (https://opencode.ai/config.json)
  opencode:
    $schema: "https://opencode.ai/config.json"
    # --- Available models via opencode provider ---
    # model: opencode/minimax-m2.7       ← prod (validated v0.1.0)
    # model: opencode/minimax-m2.5       ← minimax 2.5
    # model: opencode/qwen3.6-plus            ← qwen (previous)
    # model: opencode/claude-haiku-4-5       ← haiku (validated)
    # model: opencode/deepseek-v4-pro        ← too slow on manifest generation
    # model: opencode/claude-sonnet-4-6      ← sonnet (previous)
    # model: opencode/gpt-5.1-codex          ← deprecated 2026-07-23
    # model: opencode/nemotron-3-ultra-free  ← upstream idle timeout exceeded
    model: opencode/qwen3.6-plus
    permission:
      "*": allow
      task: deny
    share: "disabled"
    autoupdate: false
    disabled_providers:
      - openai
      - gemini
      - anthropic
    provider:
      opencode:
        options:
          timeout: 900000
          chunkTimeout: 60000

  # Planned for future use:
  # claude:
  #   $schema: "https://opencode.ai/config.json"
  #   model: anthropic/claude-sonnet-4-5
  #   ...
  #
  # gemini:
  #   ...
