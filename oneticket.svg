<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" fill="none">
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#2a1c10" flood-opacity="0.22"/>
    </filter>

    <linearGradient id="cardboard" x1="-280" y1="-120" x2="300" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7c48e"/>
      <stop offset="0.5" stop-color="#d9ad70"/>
      <stop offset="1" stop-color="#c99555"/>
    </linearGradient>

    <pattern id="paperGrain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="0.9" fill="#8b653c" opacity="0.16"/>
      <circle cx="15" cy="12" r="0.7" fill="#fff1d2" opacity="0.18"/>
      <circle cx="10" cy="19" r="0.6" fill="#6e4e2d" opacity="0.10"/>
    </pattern>
  </defs>

  <g transform="translate(360 195) rotate(-10)" filter="url(#softShadow)">
    <path d="
      M -285 -115
      H 285
      Q 310 -115 310 -90
      V -50
      Q 268 -26 268 0
      Q 268 26 310 50
      V 90
      Q 310 115 285 115
      H -285
      Q -310 115 -310 90
      V 50
      Q -268 26 -268 0
      Q -268 -26 -310 -50
      V -90
      Q -310 -115 -285 -115
      Z"
      fill="url(#cardboard)"
      stroke="#8a633b"
      stroke-width="4"
      stroke-linejoin="round"/>

    <path d="
      M -285 -115
      H 285
      Q 310 -115 310 -90
      V -50
      Q 268 -26 268 0
      Q 268 26 310 50
      V 90
      Q 310 115 285 115
      H -285
      Q -310 115 -310 90
      V 50
      Q -268 26 -268 0
      Q -268 -26 -310 -50
      V -90
      Q -310 -115 -285 -115
      Z"
      fill="url(#paperGrain)"
      opacity="0.75"/>

    <path d="M -260 -84 H 130
             M 172 -84 H 238
             M -260 84 H 130
             M 172 84 H 238"
          stroke="#4d351e"
          stroke-width="4"
          stroke-linecap="round"/>

    <path d="M -260 -84
             C -248 -65 -272 -52 -272 -34
             C -272 -17 -248 -10 -248 0
             C -248 10 -272 17 -272 34
             C -272 52 -248 65 -260 84
             M 238 -84
             C 248 -65 272 -52 272 -34
             C 272 -17 248 -10 248 0
             C 248 10 272 17 272 34
             C 272 52 248 65 238 84"
          stroke="#4d351e"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <line x1="150" y1="-96" x2="150" y2="96"
          stroke="#4d351e"
          stroke-width="4"
          stroke-dasharray="14 14"
          stroke-linecap="round"/>

    <text x="-65" y="35"
          text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="112"
          font-weight="900"
          fill="#3f2b19"
          stroke="#2a1c10"
          stroke-width="1">PR#1</text>

    <text x="222" y="-48"
          text-anchor="middle"
          font-family="Arial Black, Arial, Helvetica, sans-serif"
          font-size="58"
          font-weight="900"
          fill="#3f2b19"
          stroke="#2a1c10"
          stroke-width="0.8"
          transform="rotate(90 222 -48)">PR#1</text>
  </g>
</svg>